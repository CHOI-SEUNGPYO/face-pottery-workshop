<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유물 이야기 편집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4eee2;color:#483620;font:15px/1.6 system-ui,sans-serif}header{position:sticky;top:0;background:#fcf8efed;backdrop-filter:blur(12px);border-bottom:1px solid #d7cbb6;padding:16px 4vw;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:1}h1{font-size:22px;margin:0}h2{font-size:18px}main{max-width:1220px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:#fffaf2;border:1px solid #e2d1b5;border-radius:20px;padding:24px;margin-bottom:24px}label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;font:inherit;background:white;border:1px solid #cdbb9d;border-radius:10px;padding:10px;margin:5px 0}textarea{min-height:110px;resize:vertical}button{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:#e6d3b1;cursor:pointer;min-height:42px}button.primary{background:#58714d;color:white}button:disabled{opacity:.4}small{color:#856e51}#message{min-height:24px}#photo-preview{width:100%;height:240px;object-fit:contain;background:#eee2ce;border-radius:14px}.block{padding:14px 0;border-top:1px solid #e2d1b5}.block select{width:180px}.exhibit{border-top:1px solid #e2d1b5;padding-top:12px}.row{display:flex;gap:10px}.row>*{flex:1}.notice{background:#e9efdf;padding:12px;border-radius:12px}.preview-card{display:flex;gap:14px;padding:18px;background:#f4e9d5;border-radius:16px}.preview-card img{width:80px;height:110px;object-fit:contain}.preview-card h3{margin:0}#summary-preview{white-space:pre-wrap;font-size:13px}#summary-count{float:right}@media(max-width:800px){main{grid-template-columns:1fr}header{flex-wrap:wrap}header button{padding:8px}}
</style>
<header><div><h1>유물 이야기 편집</h1><small>글과 사진을 바꾸고 저장하면 게임에 반영돼요.</small></div><div><button id="restore">직전 저장본 복구</button> <button class="primary" id="save">저장하고 게임에 반영</button></div><p id="message" role="status"></p></header>
<main><div><section><h2>단계별 이야기</h2><label>게임 단계<select id="stage"></select></label><label>이야기 제목<input id="title" maxlength="100"></label><label>카드에 보여줄 짧은 설명 <small id="summary-count"></small><textarea id="summary" maxlength="140"></textarea></label><label>대표 사진<select id="stage-photo"></select></label><div id="blocks"></div><button id="add-block">이야기 문단 추가</button></section>
<section><h2>게임 카드 미리보기</h2><div class="preview-card"><img id="card-photo" alt=""><div><small>실제 유물에서 찾아보기</small><h3 id="title-preview"></h3><p id="summary-preview"></p><small>사진과 이야기 보기 ↗</small></div></div><p class="notice">‘확인된 내용·연구자의 해석·게임 속 상상’ 구분은 상세 이야기에도 표시돼요.</p></section></div>
<div><section><h2>사진 자료</h2><label>편집할 사진<select id="photo"></select></label><img id="photo-preview" alt=""><label>사진 추가<input id="photo-upload" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="replace-photo">선택한 사진 교체</button><input id="replace-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><label>사진 설명<input id="caption" maxlength="500"></label><label>대체 설명<input id="alt" maxlength="300"></label><label>제공자·이용 조건<textarea id="credit" maxlength="1000"></textarea></label><label>출처 주소<input id="source" type="url" placeholder="https://"></label><div class="row"><button id="photo-up">앞으로 이동</button><button id="photo-down">뒤로 이동</button><button id="delete-photo">사진 삭제</button></div></section>
<section><h2>배경 전시 유물</h2><p>실제 GLB 모델을 등록하면 뒤쪽 전시 공간에 놓여요. 사진 자료는 위에서 관리해요.</p><label>모델 추가<input id="model-upload" type="file" accept=".glb"></label><div id="exhibits"></div></section></div></main>
<script>window.editorToken='__TOKEN__'</script><script type="module" src="/editor.js"></script></html>
