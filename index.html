<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee5d7"><title>내 얼굴토기 · 흙으로 만드는 나만의 이야기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏺%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <div class="welcome-copy"><p class="eyebrow">흙으로 만드는 나만의 이야기</p><h1 id="welcome-title">내 얼굴토기</h1><p class="welcome-description">말랑한 흙에 상상을 담아<br>나만의 얼굴을 만들어 볼까요?</p><div class="journey"><span>흙 빚기</span><i>·</i><span>얼굴 만들기</span><i>·</i><span>다시 발견하기</span></div><div class="welcome-actions"><button id="start" class="primary large">만들기 시작 <span aria-hidden="true">→</span></button><button id="resume" class="secondary" hidden>이어 만들기</button></div><button class="text-button" data-action="about">어떤 유물에서 시작됐을까요? <span aria-hidden="true">↗</span></button></div>
      <figure class="welcome-art"><span class="art-kicker">오래된 얼굴, 새로운 상상</span><div class="artifact-glow"><img src="assets/artifact.png" alt="경산 소월리에서 출토된 얼굴 장식 토기와 시루"></div><figcaption>경산 소월리 출토 얼굴 장식 토기<br><small>시루 위에 얹은 모습은 추정 복원이에요.</small></figcaption><span class="spark" aria-hidden="true">✦</span></figure>
      <p class="welcome-foot">손끝으로 빚는 작은 박물관</p>
    </section>

    <section id="workshop" class="workshop" hidden aria-labelledby="stage-title">
      <header class="topbar"><button id="home" aria-label="처음으로" class="secondary compact"><span aria-hidden="true">⌂</span><span>처음으로</span></button><div class="stage-heading"><small>지금 하는 일</small><h1 id="stage-title"></h1><p id="stage-subtitle"></p></div><div class="progress"><span id="stage-count"></span><div class="progress-track"><div id="progress-fill"></div></div></div><button id="help" class="secondary compact"><span aria-hidden="true">?</span> 도움말</button></header>
      <div class="work-area">
        <aside class="guide"><div class="speech"><p id="speech"></p></div><div class="character-wrap"><img id="character" alt="작업을 안내하는 캐릭터"><span class="character-shadow"></span></div><div class="tip"><h2>작은 팁</h2><p id="tip"></p></div></aside>
        <section class="activity" aria-label="토기 작업 공간"><h2 id="instruction"></h2><div id="stage-surface" tabindex="0" role="application" aria-label="토기 작업. 도구를 고르고 손가락이나 마우스로 조작해요. 왼쪽 오른쪽 화살표 키로 회전해요."><div id="scene"></div><canvas id="soil" hidden aria-label="흙을 문질러 내 작품을 찾아요"></canvas><svg id="drawing" aria-hidden="true"><polyline fill="none" stroke="#f0c96f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="scene-error" hidden></div><div id="fire-overlay" aria-hidden="true"><span></span></div><figure id="compare" hidden><img src="assets/artifact.png" alt="실제 출토된 얼굴 장식 토기와 시루"><figcaption>실제 유물<small>문화재청 보도자료 (2019)</small></figcaption></figure></div><div class="activity-bottom"><p id="action-hint"></p><div id="rotate-controls" class="rotation"><button data-rotate="-0.35" aria-label="토기 왼쪽으로 돌리기">↶</button><span>360° 돌려 보기</span><button data-rotate="0.35" aria-label="토기 오른쪽으로 돌리기">↷</button></div><label id="face-guides" class="face-guides" hidden>얼굴 자리 안내 <select id="guide-count"><option value="0">자유롭게</option><option value="2">두 면</option><option value="3">세 면</option></select></label><div id="task-progress" hidden><progress max="100" value="0"></progress><span></span></div></div></section>
        <aside id="story" class="story"><button id="story-close" class="icon-button" aria-label="유물 이야기 접기">×</button><h2>유물 이야기</h2><div class="story-photo"><img src="assets/artifact.png" alt="실제 출토 유물 사진"></div><p id="fact"></p><button class="text-button" data-action="about">자세히 보기 <span aria-hidden="true">›</span></button></aside><button id="story-open" class="story-tab" aria-expanded="false" aria-controls="story">유물 이야기 <span aria-hidden="true">‹</span></button>
      </div>
      <footer class="toolbar"><button id="previous" class="secondary"><span aria-hidden="true">←</span> 이전으로</button><div id="tools" class="tools" role="group" aria-label="작업 도구"></div><button id="next" class="primary">다음으로 <span aria-hidden="true">→</span></button></footer>
    </section>

    <section id="ending" class="ending" hidden aria-labelledby="end-title"><div class="end-copy"><p class="eyebrow">흙에서 나만의 작품까지</p><h1 id="end-title">세상에 하나뿐인<br>내 얼굴토기!</h1><p>내가 만든 얼굴과 구멍을<br>다시 천천히 살펴봐요.</p><div class="end-actions"><button id="view-again" class="primary">내 토기 다시 보기 <span aria-hidden="true">→</span></button><button id="finish" class="secondary">처음 화면으로</button></div></div><div id="end-display"><div id="end-scene" tabindex="0" role="application" aria-label="완성 작품. 손가락으로 끌거나 좌우 화살표 키로 돌려 보세요."></div><p>나만의 작품 <span>손가락으로 돌려 보세요</span></p></div></section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><button id="dialog-close" class="icon-button" aria-label="닫기">×</button><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></dialog>
  <noscript>이 체험에는 JavaScript가 필요해요. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
