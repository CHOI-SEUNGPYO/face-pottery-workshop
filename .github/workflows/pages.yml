name: Test and deploy workshop

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify prototype
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Verify build, geometry and server
        run: npm run build && npm run check:openings && npm test
      - name: Save verified website
        uses: actions/upload-artifact@v4
        with:
          name: workshop-site
          path: game/dist
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser check · ${{ matrix.suite }} · ${{ matrix.check || matrix.width }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: ui, width: all, check: form-controls}
          - {suite: ui, width: all, check: interactions}
          - {suite: ui, width: all, check: line-width}
          - {suite: ui, width: all, check: body-guidance}
          - {suite: ui, width: all, check: guidance}
          - {suite: ui, width: all, check: loading}
          - {suite: workshop, width: all}
          - {suite: journey, width: '1366'}
          - {suite: journey, width: '740'}
          - {suite: journey, width: '390'}
          - {suite: mobile, width: all}
          - {suite: art, width: all}
          - {suite: performance, width: all}
          - {suite: optimization, width: all}
          - {suite: examples, width: all}
    env:
      TOGI_JOURNEY_WIDTH: ${{ matrix.width }}
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: workshop-site
          path: game/dist
      - name: Verify browser behavior
        run: |
          if ('${{ matrix.suite }}' -eq 'ui') {
            node scripts/check-${{ matrix.check }}.mjs
          } else {
            npm run check:${{ matrix.suite }}
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save failed browser checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-failures-${{ matrix.suite }}-${{ matrix.check || matrix.width }}
          path: game/asset/review
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workshop-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: pages-artifact
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          for attempt in {1..15}; do
            sleep 2
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME&per_page=100" --jq '.artifacts[] | select(.expired == false) | .id')
            if [ "$artifact_id" = "$PAGES_ARTIFACT_ID" ]; then
              echo "Uploaded Pages artifact is available."
              exit 0
            fi
          done
          echo "::error::Uploaded Pages artifact did not become available."
          exit 1
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
