<!doctype html><html lang="ko"><meta charset="utf-8"><title>둥근 꼭대기 확인</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#594235;font:17px sans-serif}h1{margin:24px;font-size:25px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 20px}section{min-width:0;border:1px solid #d9c6ae;border-radius:20px;text-align:center}h2{font-size:20px}section>div{height:430px}p{font-size:15px;padding:0 18px;line-height:1.6}button{padding:12px 20px;margin:8px;border:1px solid #9c7b5b;border-radius:20px;background:#fff7e8;color:#594235}canvas{display:block;width:100%;height:100%}</style>
<h1>꼭대기 마감 확인 · 실제 게임 렌더러</h1><main>
<section><h2>가는 목과 넓은 몸체</h2><div id="neck"></div><p>꼭짓점으로 모이지 않고<br>편집한 목의 폭에 맞춰 둥글게 닫힙니다.</p></section>
<section><h2>전체를 가늘게 다듬은 상태</h2><div id="thin"></div><p>고정 크기의 덮개 없이<br>좁힌 굵기 그대로 이어집니다.</p></section>
<section><h2>정수리와 옆 구멍</h2><div id="opened"></div><p>둥근 표면에 정수리 입구와<br>옆 구멍·돌출부를 연결합니다.</p><button id="turn">돌려 보기</button></section>
</main><script type="module">
import {Pottery} from '../src/pottery.js';
import {freshModel,reshapeProfile} from '../src/model.js';
const neck=freshModel();
for(let i=0;i<2;i++)reshapeProfile(neck,structuredClone(neck),.99,-.5,0);
new Pottery(document.querySelector('#neck'),neck);
const thin=freshModel();for(let pass=0;pass<3;pass++)for(const v of Array.from({length:21},(_,i)=>i/20))reshapeProfile(thin,structuredClone(thin),v,-.6,0);
new Pottery(document.querySelector('#thin'),thin);
const opened=freshModel();reshapeProfile(opened,structuredClone(opened),.94,-.2,0);
opened.crown=Array.from({length:40},(_,i)=>[Math.cos(i/40*Math.PI*2)*.22,Math.sin(i/40*Math.PI*2)*.22]);
opened.marks=[{tool:'hole',points:[[0,.6]]},{tool:'ear',points:[[.17,.65]]}];
const last=new Pottery(document.querySelector('#opened'),opened);last.setStage(3);
document.querySelector('#turn').onclick=()=>last.rotate(.45);
</script></html>
