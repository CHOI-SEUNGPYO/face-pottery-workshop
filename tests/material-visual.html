<!doctype html><html lang="ko"><meta charset="utf-8"><title>흙 재료 반응 확인</title><style>body{margin:0;background:#f4efe4;color:#5b4434;font:17px sans-serif}h1{font-size:23px;margin:20px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}section{text-align:center;border:1px solid #cbb89d;border-radius:18px}section>div{height:450px}h2{font-size:18px}canvas{width:100%;height:100%;display:block}button{margin:16px;padding:13px;border-radius:20px;background:#fff9ee;border:1px solid #9f805e;color:inherit;font:inherit}</style>
<h1>당기면 가늘어지고, 누르면 주변으로 퍼지는 흙</h1><main><section><h2>기본 흙</h2><div id="a"></div></section><section><h2>위에서 아래로 누르기</h2><div id="b"></div></section><section><h2>몸통 당기고 다시 줄이기</h2><div id="c"></div></section></main><button id="turn">돌려 보기</button><button id="play">게임에서 직접 만지기</button><script type="module">
import {freshModel,reshapeProfile} from '../src/model.js';import {Pottery} from '../src/pottery.js';
const a=freshModel(),b=freshModel(),c=freshModel();reshapeProfile(b,a,1,0,-.6);reshapeProfile(c,a,.5,.7,.4);reshapeProfile(c,structuredClone(c),.75,-.4,-.3);
const pots=[a,b,c].map((m,i)=>{const p=new Pottery(document.getElementById('abc'[i]),m);p.setStage(1);return p;});document.getElementById('turn').onclick=()=>pots.forEach(p=>{p.setTool('rotate');p.rotate(.6);});document.getElementById('play').onclick=()=>{if(location.port==='4175'){localStorage.setItem('face-pottery-v1',JSON.stringify(a));location.href='/';}};
</script></html>
