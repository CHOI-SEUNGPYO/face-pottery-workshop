<!doctype html><html lang="ko"><meta charset="utf-8"><title>연속 윤곽 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#594235;font:17px sans-serif}h1{margin:24px;font-size:25px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 20px}section{min-width:0;border:1px solid #d9c6ae;border-radius:20px;text-align:center}h2{font-size:20px}section>div{height:430px}p{font-size:15px;padding:0 18px;line-height:1.6}button{padding:12px 20px;margin:8px;border:1px solid #9c7b5b;border-radius:20px;background:#fff7e8;color:#594235}canvas{display:block;width:100%;height:100%}</style>
<h1>같은 가는 윤곽 · 이전 계산과 교체 후 비교</h1><main>
<section><h2>이전 계산 재현</h2><div id="before"></div><p>변형량에 기본 윤곽이 다시 더해져<br>끝에 뚜껑과 받침이 남았습니다.</p></section>
<section><h2>연속 윤곽으로 교체</h2><div id="after"></div><p>다듬은 굵기 그대로 연결됩니다.<br>별도의 머리·받침이 없습니다.</p></section>
<section><h2>다시 넓히고 구멍 뚫기</h2><div id="edited"></div><p>위쪽과 아래쪽을 다시 다듬을 수 있고<br>구멍과 내부 두께도 유지됩니다.</p><button id="turn">돌려 보기</button></section>
</main><script type="module">
import {Pottery} from '../src/pottery.js';
import {freshModel,reshapeProfile,baseRadius,clamp,ROWS,COLS} from '../src/model.js';
const thin=freshModel();for(let pass=0;pass<3;pass++)for(const v of [.1,.3,.5,.7,.9])reshapeProfile(thin,structuredClone(thin),v,-.6,0);
// Reproduce the pre-fix renderer from the same stored radius edits for comparison.
const old=structuredClone(thin);old.profile=Array.from({length:ROWS+1},(_,row)=>{
  const centre=clamp(row,5,34);let offset=0;
  for(let d=-7;d<=7;d++)offset+=thin.offsets[clamp(centre+d,0,ROWS)*COLS]*(8-Math.abs(d))/64;
  const taper=row>34?baseRadius(row/ROWS)/baseRadius(.85):1;
  return Math.max(.18*taper,baseRadius(row/ROWS)+offset*taper);
});
new Pottery(document.querySelector('#before'),old);
new Pottery(document.querySelector('#after'),thin);
const edited=structuredClone(thin);reshapeProfile(edited,structuredClone(edited),.68,.48,0);reshapeProfile(edited,structuredClone(edited),.08,.17,0);
edited.crown=Array.from({length:40},(_,i)=>[Math.cos(i/40*Math.PI*2)*.2,Math.sin(i/40*Math.PI*2)*.2]);
edited.marks=[{tool:'hole',points:[[0,.6]]},{tool:'ear',points:[[.17,.65]]}];
const last=new Pottery(document.querySelector('#edited'),edited);last.setStage(3);
document.querySelector('#turn').onclick=()=>last.rotate(.45);
</script></html>
