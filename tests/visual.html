<!doctype html><html lang="ko"><meta charset="utf-8"><title>조형 회귀 검사</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f2e6;color:#594235;font:18px sans-serif}h1{font-size:25px;margin:25px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px}section{min-width:0;background:#f8f2e6;border:1px solid #dfceb8;border-radius:24px;text-align:center}h2{font-size:20px}section>div{height:420px;position:relative}p{padding:0 18px;line-height:1.6;font-size:15px}canvas{display:block;width:100%;height:100%}</style>
<h1>하나로 이어진 몸체와 낮게 올라온 입구</h1><main>
<section><h2>둥근 입구 · 기본 몸체</h2><div id="whole"></div><p>몸체에서 입구 벽과 테두리가 이어집니다.</p></section>
<section><h2>자유롭게 그린 별 입구</h2><div id="star"></div><p>그린 모양을 따라 입구가 올라옵니다.</p><button id="top">위에서 보기</button></section>
<section><h2>머리까지 좁히고 길게 늘인 몸체</h2><div id="pressed"></div><p>윗부분도 함께 변하고 고정된 덮개가 남지 않습니다.</p><button id="turn">돌려 보기</button></section>
</main><script type="module">
import {Pottery} from '../src/pottery.js';
import {freshModel,reshapeProfile} from '../src/model.js';
import {strokeContour} from '../src/contour.js';
const round=freshModel();round.crown=Array.from({length:64},(_,i)=>[Math.cos(i/64*Math.PI*2)*.25,Math.sin(i/64*Math.PI*2)*.25]);
round.marks=[-.075,.075].map(u=>({tool:'hole',points:Array.from({length:40},(_,i)=>[u+Math.cos(i/40*Math.PI*2)*.032,.8+Math.sin(i/40*Math.PI*2)*.025])}));round.marks.push({tool:'hole',points:Array.from({length:40},(_,i)=>[Math.cos(i/40*Math.PI*2)*.045,.68+Math.sin(i/40*Math.PI*2)*.02])});
const plain=new Pottery(document.querySelector('#whole'),round);plain.setStage(3);
const star=freshModel();star.crown=strokeContour(Array.from({length:10},(_,i)=>{const a=Math.PI/2+i*Math.PI/5,r=i%2?.33:.78;return [Math.cos(a)*r,Math.sin(a)*r];}));
star.crown=star.crown.map(([x,y])=>[x*.65,y*.65]);const hole=new Pottery(document.querySelector('#star'),star);hole.setStage(3);
const pressed=structuredClone(round);reshapeProfile(pressed,structuredClone(pressed),.55,-.38,0);reshapeProfile(pressed,structuredClone(pressed),.87,-.28,0);pressed.height=1.3;
const stress=new Pottery(document.querySelector('#pressed'),pressed);stress.setStage(3);
document.querySelector('#turn').onclick=()=>stress.rotate(.35);
document.querySelector('#top').onclick=()=>hole.setStage(hole.stage===2?3:2);
</script></html>
