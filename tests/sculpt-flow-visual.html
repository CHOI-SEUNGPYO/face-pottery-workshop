<!doctype html><html lang="ko"><meta charset="utf-8"><title>같은 조작의 띠 재발 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe4;color:#5b4434;font:17px sans-serif}h1{font-size:24px;margin:20px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px}section{text-align:center;border:1px solid #cbb89d;border-radius:20px}section>div{height:440px}h2{font-size:20px}canvas{display:block;width:100%;height:100%}button,select{margin:15px;padding:12px 18px;background:#fff9ee;border:1px solid #9f805e;border-radius:24px;color:inherit;font:inherit}output{display:block;margin:15px}p{font-size:15px}</style>
<h1>같은 손동작 · 수정 전후 비교</h1><label>조작 <select id="case"></select></label><main><section><h2>기존 v0.3.8</h2><div id="old"></div><p>이전에 배포한 계산 결과를 그대로 보관</p></section><section><h2>수정안</h2><div id="next"></div><p>굵기 보정 띠 대신 매끄러운 공간 변형</p></section></main><button id="turn">돌려 보기</button><button id="play">이 조작을 게임에서 확인</button><script type="module">
import {freshModel,reshapeProfile} from '../src/model.js';import {Pottery} from '../src/pottery.js';
const data=await (await fetch('./sculpt-flow-cases.json')).json(),choose=document.getElementById('case'),pots=[];let current;
for(const [i,c] of data.cases.entries()){const o=document.createElement('option');o.value=i;o.textContent=c.name;choose.append(o);}
function changed(m,stroke){reshapeProfile(m,structuredClone(m),...stroke);}

function show(){const c=data.cases[choose.value],old=Object.assign(freshModel(),structuredClone(c.previous));current=freshModel();for(const s of c.strokes)changed(current,s);for(const [i,m]of [old,current].entries()){if(pots[i]){pots[i].model=m;pots[i].update();}else pots[i]=new Pottery(document.getElementById(i?'next':'old'),m);pots[i].setStage(1);}}
choose.onchange=show;show();document.getElementById('turn').onclick=()=>pots.forEach(p=>{p.setTool('rotate');p.rotate(.5);});document.getElementById('play').onclick=()=>{if(location.port==='4175'){localStorage.setItem('face-pottery-v1',JSON.stringify(current));location.href='/';}};
</script></html>
